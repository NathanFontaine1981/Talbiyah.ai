# Netlify Configuration for Talbiyah.ai
# Enables automatic deployments from GitHub

[build]
  command = "npm run build"
  publish = "dist"

# Use Node.js 18 for builds
[build.environment]
  NODE_VERSION = "18"

# Note: the prerendered marketing routes (/compare-plans, /how-to, /features,
# /salah, /jummah-guide - see scripts/prerender.mjs) need no redirect rule.
# They're written as flat files (dist/compare-plans.html, not
# dist/compare-plans/index.html) specifically so Netlify's clean-URL
# resolution serves them directly with no rewrite/redirect - a
# directory+index.html was tried first and triggers Netlify's automatic
# 301-to-trailing-slash for real directories, which works but adds a hop and
# mismatches the no-trailing-slash URLs in sitemap.xml/robots.txt.

# Redirect all other routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS - Force HTTPS for 1 year, include subdomains, allow preload list
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), interest-cohort=()"
    # Cross-Origin policies for additional isolation
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Content Security Policy - prevents XSS and injection attacks
    # Note: 'unsafe-inline' for styles is needed for many UI libraries
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://js.stripe.com https://*.supabase.co https://*.100ms.live https://unpkg.com https://cdn.jsdelivr.net blob:; worker-src 'self' https://unpkg.com blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://*.stripe.com https://*.100ms.live https://api.dicebear.com https://storage.googleapis.com https://images.unsplash.com https://img.youtube.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.100ms.live wss://*.100ms.live https://api.quran.com https://api.aladhan.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://storage.googleapis.com https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; frame-src 'self' https://js.stripe.com https://*.100ms.live https://quranwbw.com https://www.youtube.com https://youtube.com; media-src 'self' blob: https://*.100ms.live; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Don't cache index.html - always fetch latest version
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Don't cache the root path either
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Same treatment for the other prerendered marketing snapshots - each is
# regenerated on every build, so never let a stale copy get served between
# deploys.
[[headers]]
  for = "/compare-plans"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/how-to"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/features"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/salah"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/jummah-guide"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache static assets for better performance (they have unique hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
